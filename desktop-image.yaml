name: ubuntu-desktop-qualcomm-dragonwing-arm64
display-name: Ubuntu Desktop Qualcomm Dragonwing arm64
revision: 2
architecture: arm64
series: noble
class: preinstalled
kernel: linux-qcom
gadget:
  url: https://github.com/canonical/qualcomm-dragonwing-gadget.git
  type: git
  branch: noble
rootfs:
  mirror: http://ports.ubuntu.com/ubuntu-ports/
  pocket: updates
  components:
    - main
    - restricted
    - universe
    - multiverse
  seed:
    urls:
      - https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/
    branch: noble
    names:
      - desktop-minimal
      - minimal
      - standard
      - cloud-image
  sources-list-deb822: true
customization:
  cloud-init:
    user-data: |
      #cloud-config
      groups:
        - system
      users:
        - name: ubuntu
          groups: adm, cdrom, dip, lxd, sudo, video, audio, plugdev, system
          shell: /bin/bash
      chpasswd:
        expire: true
        users:
          - name: ubuntu
            password: ubuntu
            type: text
    meta-data: |
      dsmode: local
      instance-id: ubuntu-desktop
    network-config: |
      #cloud-config
      network:
        renderer: NetworkManager
        version: 2
  extra-ppas:
    - name: ubuntu-qcom-iot/qcom-ppa
      fingerprint: 33EF0ACBC6FE252590ABBAF21C70EB0C444248D7
      keep-enabled: true
  extra-snaps:
    - name: snapd
    - name: gnome-46-2404
    - name: mesa-2404
  fstab:
    - label: writable
      mountpoint: /
      filesystem-type: ext4
      mount-options: discard,errors=remount-ro
      fsck-order: 1
    - label: system-boot
      mountpoint: /boot/efi/
      filesystem-type: vfat
      fsck-order: 1
    - label: persist
      mountpoint: /var/persist
      filesystem-type: ext4
      fsck-order: 2
  extra-packages:
    # GRUB signed EFI boot chain
    - name: grub-efi-arm64-signed
    - name: shim-signed
    - name: grub2-common
    # Dragonwing specific configurations
    - name: dragonwing-defaults
    # Dragonwing specific firmwares
    - name: linux-firmware-dragonwing
    # pd-mapper will be used when talking to different DSPs
    - name: protection-domain-mapper
    # audio support through ALSA
    - name: alsa-conf-qcom
    - name: pipewire-alsa
    # fix Language Support crashes
    - name: language-pack-en-base
  manual:
    make-dirs:
      - path: /var/persist
        permissions: 0775
artifacts:
  img:
    - name: ubuntu-24.04-preinstalled-desktop-arm64+dragonwing.img
  manifest:
    name: ubuntu-24.04-preinstalled-desktop-arm64+dragonwing.manifest
